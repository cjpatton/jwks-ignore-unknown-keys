name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pyjwt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: tests/pyjwt/requirements.txt
      - run: pip install -r tests/pyjwt/requirements.txt
      - run: pytest tests/pyjwt -rxX
